<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 11px;
            background: #202124;
            color: #bdc1c6;
            --mono: ui-monospace, 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
            --bg: #202124;
            --bg-t: #292a2d;
            --border: #3c4043;
            --border2: #404347;
            --text: #bdc1c6;
            --dim: #80868b;
            --bright: #e8eaed;
            --accent: #8ab4f8;
            --green: #81c995;
            --red: #f28b82;
            --yellow: #fdd663;
            --blue: #8ab4f8;
            --purple: #c58af9
        }

        body.light {
            background: #fff;
            color: #202124;
            --bg: #fff;
            --bg-t: #f1f3f4;
            --border: #dadce0;
            --border2: #e8eaed;
            --text: #202124;
            --dim: #80868b;
            --bright: #202124;
            --accent: #1a73e8;
            --green: #188038;
            --red: #d93025;
            --yellow: #b06000;
            --blue: #1a73e8;
            --purple: #7627bb
        }

        #toolbar {
            display: flex;
            align-items: center;
            height: 28px;
            padding: 0 6px;
            gap: 4px;
            background: var(--bg-t);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .t-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 3px;
            color: var(--dim);
            padding: 0;
            flex-shrink: 0
        }

        .t-btn:hover {
            background: rgba(128, 128, 128, .2);
            color: var(--bright)
        }

        .t-sep {
            width: 1px;
            height: 16px;
            background: var(--border2);
            flex-shrink: 0;
            margin: 0 2px
        }

        #sw {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            padding: 0 6px;
            height: 20px;
            width: 220px;
            gap: 4px
        }

        #sw:focus-within {
            border-color: var(--accent)
        }

        #sw svg {
            flex-shrink: 0;
            color: var(--dim)
        }

        #si {
            flex: 1;
            border: none;
            outline: none;
            background: none;
            font: 11px/1 inherit;
            color: var(--text)
        }

        #si::placeholder {
            color: var(--dim)
        }

        .t-label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--dim);
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none
        }

        .t-label input {
            cursor: pointer;
            accent-color: var(--accent)
        }

        .spacer {
            flex: 1
        }

        #cb {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--dim);
            white-space: nowrap
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dim);
            flex-shrink: 0
        }

        .dot.ok {
            background: var(--green);
            box-shadow: 0 0 4px var(--green)
        }

        #fbar {
            display: flex;
            align-items: center;
            height: 27px;
            padding: 0 6px;
            gap: 1px;
            background: var(--bg-t);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto
        }

        #fbar::-webkit-scrollbar {
            height: 0
        }

        .ftab {
            padding: 0 10px;
            height: 22px;
            line-height: 22px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--dim);
            font: 11px/1 inherit;
            border-radius: 11px;
            white-space: nowrap
        }

        .ftab:hover {
            background: rgba(128, 128, 128, .15);
            color: var(--text)
        }

        .ftab.active {
            background: rgba(138, 180, 248, .15);
            color: var(--accent);
            font-weight: 500
        }

        body.light .ftab.active {
            background: rgba(26, 115, 232, .1);
            color: var(--accent)
        }

        #tw {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            position: relative
        }

        #tw::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        #tw::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 560px
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5
        }

        thead tr {
            background: var(--bg-t);
            border-bottom: 1px solid var(--border)
        }

        th {
            text-align: left;
            padding: 4px 8px;
            font: 500 11px/1 inherit;
            color: var(--dim);
            border-right: 1px solid var(--border);
            white-space: nowrap;
            user-select: none
        }

        th:last-child {
            border-right: none
        }

        .cn {
            width: auto;
            min-width: 200px
        }

        .cm {
            width: 60px
        }

        .cs {
            width: 56px
        }

        .ct {
            width: 70px
        }

        .csz {
            width: 66px;
            text-align: right
        }

        .cti {
            width: 60px;
            text-align: right
        }

        .ca {
            width: 192px
        }

        tbody tr {
            border-bottom: 1px solid rgba(60, 64, 67, .4);
            height: 22px;
            cursor: default
        }

        body.light tbody tr {
            border-bottom-color: var(--border2)
        }

        tbody tr:hover {
            background: var(--bg-hover, #2d3748)
        }

        body.light tbody tr:hover {
            background: #e8f0fe
        }

        td {
            padding: 2px 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 11px;
            vertical-align: middle;
            border-right: 1px solid rgba(60, 64, 67, .25)
        }

        td:last-child {
            border-right: none
        }

        .tn {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text)
        }

        .bm {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .03em
        }

        .mGET {
            color: #81c995
        }

        .mPOST {
            color: #c58af9
        }

        .mPUT {
            color: #fdd663
        }

        .mDELETE {
            color: #f28b82
        }

        .mPATCH {
            color: #fdcf8c
        }

        .mHEAD {
            color: #8ab4f8
        }

        .mOPT {
            color: var(--dim)
        }

        body.light .mGET {
            color: #188038
        }

        body.light .mPOST {
            color: #7627bb
        }

        body.light .mPUT {
            color: #b06000
        }

        body.light .mDELETE {
            color: #d93025
        }

        body.light .mPATCH {
            color: #b06000
        }

        body.light .mHEAD {
            color: #1a73e8
        }

        .bs {
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 600
        }

        .s2 {
            color: #81c995
        }

        .s3 {
            color: #8ab4f8
        }

        .s4 {
            color: #fdd663
        }

        .s5 {
            color: #f28b82
        }

        .se {
            color: #f28b82
        }

        body.light .s2 {
            color: #188038
        }

        body.light .s3 {
            color: #1a73e8
        }

        body.light .s4 {
            color: #b06000
        }

        body.light .s5 {
            color: #d93025
        }

        .td {
            color: var(--dim);
            font-size: 10.5px
        }

        .tmo {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--dim);
            text-align: right
        }

        .ac {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .ab {
            padding: 1px 7px;
            height: 16px;
            line-height: 14px;
            font: 10px/14px inherit;
            border-radius: 2px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            color: var(--dim);
            white-space: nowrap
        }

        .ab:hover {
            border-color: var(--dim);
            color: var(--text);
            background: rgba(128, 128, 128, .12)
        }

        .abm {
            border-color: rgba(129, 201, 149, .5);
            color: #81c995
        }

        .abm:hover {
            background: rgba(129, 201, 149, .12);
            border-color: #81c995
        }

        .abs {
            border-color: rgba(138, 180, 248, .5);
            color: #8ab4f8
        }

        .abs:hover {
            background: rgba(138, 180, 248, .12);
            border-color: #8ab4f8
        }

        body.light .abm {
            border-color: rgba(24, 128, 56, .5);
            color: #188038
        }

        body.light .abm:hover {
            background: rgba(24, 128, 56, .08)
        }

        body.light .abs {
            border-color: rgba(26, 115, 232, .5);
            color: #1a73e8
        }

        body.light .abs:hover {
            background: rgba(26, 115, 232, .08)
        }

        .ab-bulk {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font: 11px/1 inherit;
            color: var(--dim);
            white-space: nowrap;
            flex-shrink: 0
        }

        .ab-bulk:hover {
            border-color: var(--dim);
            color: var(--text);
            background: rgba(128, 128, 128, .12)
        }

        .ab-bulk.bulk-mock {
            border-color: rgba(129, 201, 149, .4);
            color: var(--green)
        }

        .ab-bulk.bulk-mock:hover {
            background: rgba(129, 201, 149, .1);
            border-color: var(--green)
        }

        .ab-bulk.bulk-save {
            border-color: rgba(138, 180, 248, .4);
            color: var(--accent)
        }

        .ab-bulk.bulk-save:hover {
            background: rgba(138, 180, 248, .1);
            border-color: var(--accent)
        }

        body.light .ab-bulk.bulk-mock {
            border-color: rgba(24, 128, 56, .4);
            color: var(--green)
        }

        body.light .ab-bulk.bulk-save {
            border-color: rgba(26, 115, 232, .4);
            color: var(--accent)
        }

        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 60px 24px;
        color: var(--dim);
        text-align: center
        }

        #empty.show {
            display: flex
        }

        #empty svg {
            opacity: .3
        }

        .etitle {
            font-size: 13px;
            color: var(--text)
        }

        .esub {
            font-size: 11px;
            line-height: 1.5;
            max-width: 280px
        }

        #sb {
            display: flex;
            align-items: center;
            height: 20px;
            padding: 0 10px;
            gap: 12px;
            background: var(--bg-t);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            font-size: 10px;
            color: var(--dim)
        }

        #toast {
            position: fixed;
            bottom: 28px;
            right: 10px;
            padding: 5px 12px;
            background: var(--bg-t);
            border: 1px solid var(--green);
            border-radius: 3px;
            font-size: 11px;
            color: var(--green);
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
            z-index: 100
        }

        #toast.show {
            opacity: 1
        }
    </style>
</head>

<body>
    <div id="toolbar">
        <button class="t-btn" id="clearBtn" title="Clear requests">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
        </button>
        <div class="t-sep"></div>
        <div id="sw">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input id="si" type="text" placeholder="Filter">
        </div>
        <label class="t-label" title="Keep requests across page navigations">
            <input type="checkbox" id="preserveLog"> Preserve log
        </label>
        <div class="t-sep"></div>
        <button class="ab-bulk bulk-mock" id="mockAllBtn" title="Mock all visible requests">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            Mock All
        </button>
        <button class="ab-bulk bulk-save" id="saveAllBtn" title="Save all visible requests to the Requests panel">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <polyline points="17 21 17 13 7 13 7 21" />
                <polyline points="7 3 7 8 15 8" />
            </svg>
            Save All
        </button>
        <div class="spacer"></div>
        <div id="cb"><span class="dot" id="cdot"></span><span id="ctext">Disconnected</span></div>
    </div>
    <div id="fbar">
        <button class="ftab active" data-type="all">All</button>
        <button class="ftab" data-type="xhr">Fetch/XHR</button>
        <button class="ftab" data-type="doc">Doc</button>
        <button class="ftab" data-type="css">CSS</button>
        <button class="ftab" data-type="js">JS</button>
        <button class="ftab" data-type="img">Img</button>
        <button class="ftab" data-type="font">Font</button>
        <button class="ftab" data-type="media">Media</button>
        <button class="ftab" data-type="ws">WS</button>
        <button class="ftab" data-type="other">Other</button>
    </div>
    <div id="tw">
        <table>
            <thead>
                <tr>
                    <th class="ca">Actions</th>
                    <th class="cn">Name</th>
                    <th class="cm">Method</th>
                    <th class="cs">Status</th>
                    <th class="ct">Type</th>
                    <th class="csz">Size</th>
                    <th class="cti">Time</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div id="empty">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 8 12 12 14 14" />
            </svg>
            <div class="etitle">Recording network activity…</div>
            <div class="esub">Reload the page or perform a request to see it here.</div>
        </div>
    </div>
    <div id="sb">
        <span id="stotal">0 requests</span>
        <span id="sfiltered" style="display:none"></span>
    </div>
    <div id="toast"></div>
    <script src="devtools-panel.js"></script>
</body>

</html>

[package]
name = "bifurc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Bifurc desktop UI: a GPUI app that runs the Bifurc engine as a sidecar."

[[bin]]
name = "bifurc-ui"
path = "src/main.rs"

[dependencies]
bifurc-engine-client = { path = "../engine-client" }
base64 = "0.22"
futures = "0.3"
gpui-kit = { version = "0.7", features = [
    "tree-sitter",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-graphql",
    "tree-sitter-bash",
    "tree-sitter-python",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tray-icon = "0.1"
# The tray icon ships as a PNG; the window's handle comes back as a raw handle.
png = "0.17"
raw-window-handle = "0.6"

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 16px;
            font-size: 13px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .header img {
            width: 20px;
            height: 20px;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 600;
        }

        .section {
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .row label {
            font-size: 13px;
            color: #ccc;
        }

        .row .desc {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            cursor: pointer;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle .slider {
            position: absolute;
            inset: 0;
            background: #444;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .toggle .slider::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked+.slider {
            background: #4ade80;
        }

        .toggle input:checked+.slider::before {
            transform: translateX(16px);
        }

        /* Input */
        input[type="number"] {
            width: 72px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 12px;
            font-family: monospace;
            padding: 4px 8px;
            text-align: right;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #4ade80;
        }

        /* Status dot */
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 6px 10px;
            background: #222;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-connected {
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }

        .dot-disconnected {
            background: #666;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon48.png" alt="LP">
        <h1>Bifurc</h1>
    </div>

    <div class="status" id="status">
        <span class="dot dot-disconnected" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
    </div>

    <div class="section">
        <div class="section-title">Proxy</div>
        <div class="row">
            <div>
                <label>Route traffic through proxy</label>
                <div class="desc">All browser HTTP(S) traffic will be proxied</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="proxyToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row">
            <label>Proxy port</label>
            <input type="number" id="proxyPort" min="1" max="65535" value="80">
        </div>
    </div>

    <div class="section">
        <div class="section-title">Companion Server</div>
        <div class="row">
            <label>WebSocket port</label>
            <input type="number" id="companionPort" min="1" max="65535" value="9271">
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>

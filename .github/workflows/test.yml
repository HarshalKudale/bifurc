name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Static checks ───────────────────────────────────────────────────────────
  # Fast failure: catch type errors before spending time on the test suites.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck main process (src/)
        run: npm run typecheck

      - name: Typecheck E2E specs
        run: npm run typecheck:e2e

      # `typecheck:renderer` covers `renderer/` and `packages/gui/src` — neither is a package nor under
      # `src/`, so the `npm run typecheck` step above does not reach them, and `@bifurc/gui` is
      # deliberately out of `typecheck:packages` (including it would break `npm run typecheck`).
      #
      # This step replaced `typecheck:web` when the browser host was decommissioned. That command typechecked
      # the shared UI *because* `web/` imported `@bifurc/gui`, so dropping it without a replacement would have
      # removed the only CI gate over `packages/gui` — the gap would have looked like a deletion rather than a
      # regression.
      #
      # **`continue-on-error`, because this check cannot pass yet, and a red gate is worse than a visible
      # report.** The shared UI carries **34 pre-existing type errors** that have never been gated anywhere.
      # Fixing them is its own work item; until then this step is a *report*.
      - name: Typecheck the renderer and the shared UI
        run: npm run typecheck:renderer
        continue-on-error: true

  # ── Unit + integration ──────────────────────────────────────────────────────
  # `test:ci` runs every Vitest project (unit and integration) with coverage and
  # enforces the thresholds declared in vitest.config.ts. A coverage regression
  # fails the build rather than silently shipping.
  unit-and-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ── End-to-end (real Electron app) ──────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Electron needs a set of native libraries that are not present on the
      # ubuntu-latest image by default. Without these the app fails to launch and
      # every E2E test errors out before it can assert anything.
      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-traces
          path: test-results/

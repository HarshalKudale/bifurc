name: Release macOS (self-hosted)

# Manual stand-in for release.yml while the hosted runners are out of free minutes: builds the macOS packages
# for an existing tag on the self-hosted (Intel) macOS runner and attaches them to that tag's release. The
# runner is x64; the arm64 build is cross-compiled on it. `cargo xtask package` has no macOS target yet, so
# this stages the same folder layout itself, wraps it in a Bifurc.app and ships one .dmg per architecture.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and attach the packages to"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: [self-hosted, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      # Not setup-rust-toolchain: on macOS it runs `brew install bash`, and this runner has no Homebrew.
      - name: Install Rust
        run: |
          if ! command -v rustup > /dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # GPUI compiles its Metal shaders at build time, which needs the full Xcode (not only the command line tools).
      - name: Check Xcode
        run: xcrun --sdk macosx metal --version

      - name: Build
        env:
          BIFURC_GITHUB_CLIENT_ID: ${{ vars.BIFURC_GITHUB_CLIENT_ID }}
          BIFURC_POSTHOG_KEY: ${{ vars.BIFURC_POSTHOG_KEY }}
          BIFURC_POSTHOG_HOST: ${{ vars.BIFURC_POSTHOG_HOST }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p bifurc-engine -p bifurc-cli -p bifurc-mcp
          (cd ui && cargo build --release --locked --target ${{ matrix.target }} -p bifurc-ui -p bifurc-cli)

      # The folder `cargo xtask package` stages (launcher in bin/, CLI and MCP server in resources/) goes whole
      # into Contents/MacOS, where the UI finds the engine beside itself; then the .app is wrapped in a .dmg.
      - name: Package
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml)"
          name="Bifurc-${version}-macos-${{ matrix.arch }}"
          dist="release/desktop"
          app="$dist/stage/Bifurc.app"
          out="$app/Contents/MacOS"
          rel="target/${{ matrix.target }}/release"
          uirel="ui/target/${{ matrix.target }}/release"
          rm -rf "$dist/stage"
          mkdir -p "$out/bin" "$out/resources" "$app/Contents/Resources"
          cp "$uirel/bifurc-ui" "$out/bifurc-ui"
          cp "$uirel/bifurc" "$out/bin/bifurc"
          cp "$rel/bifurc" "$out/resources/bifurc-cli"
          cp "$rel/bifurc-mcp" "$out/resources/bifurc-mcp"
          cp "$rel/bifurc-engine" "$out/bifurc-engine"
          cp build/icon.png "$out/resources/icon.png"
          cp LICENSE "$out/LICENSE"
          if [ -f "$uirel/bifurc-tray" ]; then cp "$uirel/bifurc-tray" "$out/bifurc-tray"; fi

          iconset="$dist/stage/Bifurc.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size build/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) build/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Bifurc.icns"
          rm -rf "$iconset"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Bifurc</string>
            <key>CFBundleDisplayName</key><string>Bifurc</string>
            <key>CFBundleIdentifier</key><string>app.bifurc.desktop</string>
            <key>CFBundleExecutable</key><string>bifurc-ui</string>
            <key>CFBundleIconFile</key><string>Bifurc</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # Only the x64 build can run on this machine.
          if [ "${{ matrix.arch }}" = "x64" ]; then "$out/bin/bifurc" commands --json > /dev/null; fi

          # Ad-hoc signed: the bundle's launch is allowed on Apple Silicon, Gatekeeper still asks (no notarization).
          codesign --force --deep --sign - "$app"
          ln -s /Applications "$dist/stage/Applications"
          hdiutil create -volname "Bifurc" -srcfolder "$dist/stage" -ov -format UDZO "$dist/${name}.dmg"
          rm -rf "$dist/stage"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: release/desktop/*.dmg

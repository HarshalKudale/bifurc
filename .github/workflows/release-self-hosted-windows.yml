name: Release Windows (self-hosted)

# Manual stand-in for release.yml while the hosted runners are out of free minutes: builds the Windows
# packages for an existing tag on the self-hosted Windows runner and attaches them to that tag's release.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and attach the packages to"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # The Windows SDK (makeappx, makepri) is expected on the machine.
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          BIFURC_GITHUB_CLIENT_ID: ${{ vars.BIFURC_GITHUB_CLIENT_ID }}
          BIFURC_POSTHOG_KEY: ${{ vars.BIFURC_POSTHOG_KEY }}
          BIFURC_POSTHOG_HOST: ${{ vars.BIFURC_POSTHOG_HOST }}
        run: cargo xtask package --release-tag "$RELEASE_TAG"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            release/desktop/*.msix
            release/desktop/*.zip

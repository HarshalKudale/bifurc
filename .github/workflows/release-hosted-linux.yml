name: Release Linux (GitHub-hosted)

# release-self-hosted-linux.yml on a GitHub-hosted runner: builds the Linux packages for an existing tag and
# attaches them to that tag's release, replacing any file of the same name already there.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and attach the packages to"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: release
          cache-on-failure: true

      # dpkg-dev reads the .deb's dependencies from the executables; it comes with build-essential.
      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1 dpkg-dev zip

      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          BIFURC_GITHUB_CLIENT_ID: ${{ vars.BIFURC_GITHUB_CLIENT_ID }}
          BIFURC_POSTHOG_KEY: ${{ vars.BIFURC_POSTHOG_KEY }}
          BIFURC_POSTHOG_HOST: ${{ vars.BIFURC_POSTHOG_HOST }}
        run: cargo xtask package --release-tag "$RELEASE_TAG"

      # The store manifests are folders; a release holds files.
      - name: Bundle the store manifests
        working-directory: release/desktop
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' "$GITHUB_WORKSPACE/Cargo.toml")"
          zip -r "Bifurc-${version}-linux-store-manifests.zip" manifests

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          overwrite_files: true
          files: |
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.tar.gz
            release/desktop/*-linux-store-manifests.zip

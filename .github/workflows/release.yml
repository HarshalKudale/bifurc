name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish"
        required: false
        type: string
      release_name:
        description: "GitHub release title"
        required: false
        type: string
      include_linux:
        description: "Build and upload the Linux AppImage"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            tag="${{ inputs.tag_name }}"
            prerelease="${{ inputs.prerelease }}"
          fi

          if [ -z "$tag" ]; then
            tag="v${version}"
          fi

          release_name="${{ inputs.release_name }}"
          if [ -z "$release_name" ]; then
            release_name="Bifurc ${tag}"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      # NSIS and the Windows SDK (makeappx, makepri) are on the runner image.
      - name: Build the installer and the Store package
        run: node scripts/package-desktop.mjs --target nsis,msix

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/desktop/*.exe
            release/desktop/*.msix
          if-no-files-found: error

  build-linux:
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.include_linux == true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev             libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1

      - name: Build the AppImage
        run: node scripts/package-desktop.mjs --target appimage

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/desktop/*.AppImage
          if-no-files-found: error

  publish-release:
    needs:
      - prepare
      - build-windows
      - build-linux
    if: >-
      ${{
        always() &&
        needs.build-windows.result == 'success' &&
        (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msix
            release-assets/*.AppImage

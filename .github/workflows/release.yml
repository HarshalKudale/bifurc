name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish"
        required: false
        type: string
      release_name:
        description: "GitHub release title"
        required: false
        type: string
      include_linux:
        description: "Build and upload the Linux packages"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        # What was typed into the form reaches the script as data, never as part of it.
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            tag="${INPUT_TAG_NAME}"
            prerelease="${INPUT_PRERELEASE}"
          fi

          if [ -z "$tag" ]; then
            tag="v${version}"
          fi

          release_name="${INPUT_RELEASE_NAME}"
          if [ -z "$release_name" ]; then
            release_name="Bifurc ${tag}"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # Everything is built by the packaging workflow: one `cargo xtask package` per platform.
  package:
    needs: prepare
    uses: ./.github/workflows/package-desktop.yml
    with:
      include_linux: ${{ github.event_name == 'push' || inputs.include_linux == true }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish-release:
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # The store manifests are folders; a release holds files. They go up as one archive, and the Scoop
      # manifest also on its own, so `scoop install <its url>` works straight from the release.
      - name: Bundle the store manifests
        working-directory: release-assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          zip -r "Bifurc-${VERSION}-store-manifests.zip" manifests
          cp manifests/scoop/bifurc.json bifurc.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msix
            release-assets/*.zip
            release-assets/*.nupkg
            release-assets/bifurc.json
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz

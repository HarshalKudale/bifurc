name: Package desktop app (Rust UI)

# The Rust UI + engine + CLI packages: a Windows installer, a Store package and a Linux AppImage.
# Run by hand for now; `release.yml` still publishes the Electron build.
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: "Build the Linux AppImage"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      # No `npm ci`: the engine and the CLI are Rust, and the packaging script uses only Node's built-ins.
      # NSIS and the Windows SDK (makeappx, makepri) are on the runner image.
      - name: Build the installer and the Store package
        run: npm run package:desktop -- --target nsis,msix

      - uses: actions/upload-artifact@v4
        with:
          name: bifurc-desktop-windows
          path: |
            release/desktop/*.exe
            release/desktop/*.msix
          if-no-files-found: error

  linux:
    if: ${{ inputs.include_linux }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1

      - name: Build the AppImage
        run: npm run package:desktop -- --target appimage

      - uses: actions/upload-artifact@v4
        with:
          name: bifurc-desktop-linux
          path: release/desktop/*.AppImage
          if-no-files-found: error

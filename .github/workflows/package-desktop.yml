name: Package desktop app (Rust UI)

# The Rust UI + engine + CLI packages: a Windows installer, a Store package and a Linux AppImage.
# Run by hand; `release.yml` runs the same packaging and publishes it.
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: "Build the Linux AppImage"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      # NSIS and the Windows SDK (makeappx, makepri) are on the runner image.
      - name: Build the installer and the Store package
        run: cargo xtask package --target nsis,msix
        env:
          BIFURC_GITHUB_CLIENT_ID: ${{ vars.BIFURC_GITHUB_CLIENT_ID }}
          BIFURC_POSTHOG_KEY: ${{ vars.BIFURC_POSTHOG_KEY }}
          BIFURC_POSTHOG_HOST: ${{ vars.BIFURC_POSTHOG_HOST }}

      - uses: actions/upload-artifact@v4
        with:
          name: bifurc-windows-installer
          path: release/desktop/*-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bifurc-windows-msix
          path: release/desktop/*.msix
          if-no-files-found: error

  linux:
    if: ${{ inputs.include_linux }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui

      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1

      - name: Build the AppImage
        run: cargo xtask package --target appimage
        env:
          BIFURC_GITHUB_CLIENT_ID: ${{ vars.BIFURC_GITHUB_CLIENT_ID }}
          BIFURC_POSTHOG_KEY: ${{ vars.BIFURC_POSTHOG_KEY }}
          BIFURC_POSTHOG_HOST: ${{ vars.BIFURC_POSTHOG_HOST }}

      - uses: actions/upload-artifact@v4
        with:
          name: bifurc-linux-appimage
          path: release/desktop/*.AppImage
          if-no-files-found: error

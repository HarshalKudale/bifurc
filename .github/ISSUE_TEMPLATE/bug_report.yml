name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - proxy / capture
        - HTTPS / certificates
        - requests
        - mocks
        - workspaces / git
        - vaults (beta)
        - CLI
        - MCP
        - UI
        - install / update
        - other
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, placeholder: "0.6.5"}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected, and what happened instead}
    validations: {required: true}

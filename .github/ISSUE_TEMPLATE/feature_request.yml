name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - proxy / capture
        - HTTPS / certificates
        - requests
        - mocks
        - workspaces / git
        - vaults (beta)
        - CLI
        - MCP
        - UI
        - install / update
        - other
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What problem would this solve?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: What would you like to happen?}

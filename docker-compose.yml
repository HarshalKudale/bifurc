# The compose form of the `docker run` in DOCKER.md. Phase 9, work item 6.
#
# ## Why `network_mode: host` and not `ports:`
#
# Every socket the host binds is **loopback**, and since 2026-09-25 that is not a default it could be talked
# out of: `createWsServer`, `createProxyServer` and `createEdgeRouter` each refuse a non-loopback address from
# their own factories, and the CLI has no flag that could express one. So a `ports:` mapping would publish a
# host port onto a container port nothing is listening on, and the connection would be refused. Sharing the
# host's network namespace puts the container's loopback on the host's loopback, which is what makes the host
# reachable at all — and it is what makes *"the GUI and the engine are on the same device"* a property of the
# deployment rather than a hope. `plan/10` work item 4 recommends exactly this — *"reach it via docker exec, a
# sidecar, or an SSH tunnel"*.
#
# **Corrected 2026-09-25.** This header used to say the three opt-ins existed and that a published deployment
# was therefore *"a matter of passing them rather than of changing code"*. They are gone, and so is the
# published deployment: the engine is not deployable remotely. The three listeners refuse a wide bind
# unconditionally, and `--ws-allow-non-loopback`, `--proxy-allow-non-loopback` and `--edge-allow-non-loopback`
# — along with the three `--*-bind-host` flags they went with, the `--ws-tls-cert`/`--ws-tls-key` pair, and
# `--token-file` — are now **fatal unrecognised flags** rather than silently ignored. An operator who still
# has one in a compose file gets a message naming it and saying why it went; see
# `packages/engine/src/runtime/hostArgs.ts`'s `REMOVED_FLAGS`.
#
# ## The engine's own name is not configurable, and no longer a flag
#
# Until 2026-09-24 this file carried a section here explaining that `--domain` was **required**, had no
# environment fallback, and so had to be repeated by any `command:` that overrode the image's `CMD`. **The flag
# is gone**: the engine is no longer deployable in the cloud, so it always answers as `localhost`, which is the
# only shape this file describes (`network_mode: host`, same machine). There is nothing to override, and no
# ambient default that could make an engine claim a name it does not have.
#
# ## The four ports, and which two this file can move
#
# Since `plan/17` §1 every port is **engine/host-level**, so there is one of each for the whole host
# (`plan/17` §5 work item 5 added the fourth):
#
#   | port | what | how it is set |
#   |---|---|---|
#   | `80`   | the **edge** — reverse proxy and home page | `--edge-port`, or `settings.port` in `app.json` |
#   | `8080` | the **forward proxy** | `BIFURC_PROXY_BASE_PORT` (below) |
#   | `4747` | the **companion** — the RPC endpoint | `BIFURC_COMPANION_PORT` (below) |
#   | `4748` | the **web GUI** | **derived — companion `+ 1`**, never set |
#
# **The GUI's port is not configurable, and that is the point of the entrypoint** (`plan/17` §1: *"derived,
# never a setting"*). `scripts/docker-entrypoint.mjs` computes it **once**, binds the static server on it and
# tells the host `--gui-target 127.0.0.1:<companion + 1>`, so the base domain and the listener cannot disagree.
# With `network_mode: host` the GUI is therefore at `http://localhost:4748` directly, and at
# `http://localhost/` (port `80`) through the edge — the second is the documented way in.
#
# The edge's `80` is **not** moved here: it is the port every existing `*.localhost` mapping already points at,
# and `plan/17` §1 makes a busy edge a **reported bind failure** rather than a silent increment.

services:
  bifurc:
    build: .
    image: bifurc:latest
    container_name: bifurc

    # See the header. Do not replace this with `ports:` without reading DOCKER.md first — and note that since
    # 2026-09-25 a `ports:` entry cannot work at all rather than merely being unnecessary.
    network_mode: host

    volumes:
      - bifurc-data:/data

    environment:
      # There is no token to set any more. `BIFURC_ENGINE_TOKEN` and `--token-file` were removed on
      # 2026-09-25, along with the `/data/engine.token` file the host used to write: the RPC surface binds
      # loopback, so there was no boundary left for a credential to guard. The WebSocket origin guard is what
      # keeps a page the user *visited* out — see the Dockerfile's reachability section.

      # The **forward proxy's port** (`plan/17` §1). It is no longer a scan *base* — there is no scan and no
      # per-workspace port any more — so this is the number a browser's proxy setting must name, and a busy one
      # is a reported bind failure rather than a silent increment. Stated rather than left to
      # `process.platform`, which resolves to 80 on Windows and 8080 elsewhere.
      BIFURC_PROXY_BASE_PORT: "8080"

      # The **companion's port**, left at the image's default (`4747` = `DEFAULT_COMPANION_PORT`,
      # `store/appSettings.ts`) and therefore commented out — uncomment to move it, and note that the web GUI
      # follows to `+ 1` automatically. This is the only way to move it: `scripts/docker-entrypoint.mjs`
      # resolves flag → environment → default and **pins `--ws-port` to the result**, so the static server,
      # the `--gui-target` and the healthcheck are all written against a number that is *stated* rather than
      # discovered. The healthcheck reads that resolved port from `/tmp/bifurc/companion-port`, so it follows
      # this value too.
      #
      # **Corrected 2026-09-25.** This comment used to say the entrypoint *"deliberately does **not** pin
      # `--ws-port`"*. That described the state before the entrypoint existed, and the sentence outlived it —
      # `docker-entrypoint.mjs` has pinned the port since `plan/17` §5 work item 5, which is exactly what
      # retired the `--health-cmd` override this file used to need.
      #
      # BIFURC_COMPANION_PORT: "4747"

    restart: unless-stopped

    # **The entrypoint is PID 1 and forwards SIGTERM**, waiting for the host's own exit before closing the
    # static server and exiting with the child's code. The host handles SIGTERM itself and exits
    # `128 + signo`; this is how long compose waits for that to finish stopping the proxy and closing its RPC
    # connections before sending SIGKILL.
    stop_grace_period: 20s

volumes:
  bifurc-data:

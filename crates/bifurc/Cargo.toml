[package]
name = "bifurc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The `bifurc` command: the Bifurc CLI, or the MCP server with `--mcp`."

[[bin]]
name = "bifurc"
path = "src/main.rs"

[dependencies]
bifurc-protocol = { path = "../protocol" }
bifurc-cli = { path = "../cli" }
bifurc-mcp = { path = "../mcp" }

[target.'cfg(windows)'.dependencies]
# The user's PATH lives in the registry.
winreg = "0.56"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
# The Socket.IO server of the end-to-end test.
tungstenite = "0.30"

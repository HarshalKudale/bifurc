[package]
name = "bifurc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Bifurc MCP server: the commands of the `bifurc` command line as tools, over stdio."

[lib]
name = "bifurc_mcp"
path = "src/lib.rs"

[dependencies]
# Every tool is a command of the CLI, run by the CLI's own code.
bifurc-cli = { path = "../cli" }
serde_json = { version = "1", features = ["preserve_order"] }
# The official SDK speaks the protocol, as it does for the engine's MCP client.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "bifurc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Bifurc's headless engine: the localhost proxy, mocks, workspace store and sync."

[lib]
name = "bifurc_engine"
path = "src/lib.rs"

[[bin]]
name = "bifurc-engine"
path = "src/main.rs"

[dependencies]
bifurc-protocol = { path = "../protocol" }
bifurc-client = { path = "../client" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.13"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
# Vaults: Argon2id turns a passphrase into a key, AES-256-GCM seals each secret, `zeroize` wipes keys and values.
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
# JWT signing (HMAC, RSA, ECDSA): the crypto provider rustls already uses, so no new package.
ring = "0.17.14"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
gethostname = "1"
# Patterns in mocks and proxy rules are JavaScript regular expressions.
regress = "0.12"
# Outbound HTTP: replayed requests, GraphQL, SOAP, health checks, proxy upstreams.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# The interception CA and the per-host certificates it signs.
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
time = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
flate2 = "1"
brotli = "8"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde-saphyr = "1.3"
# The local index of a workspace's request tree and mock tree.
rusqlite = { version = "0.40", features = ["bundled"] }
# The sandbox for request scripts, tests and proxy rule scripts.
rquickjs = "0.14"

# gRPC: a dynamic client (no generated code) over tonic, messages as prost-reflect dynamic messages, .proto files compiled by protox.
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-native-roots"] }
prost = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
http = "1"
bytes = "1"

# MCP client: the official SDK speaks the protocol; the engine supplies the program and the HTTP client.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
# Starts an MCP server program so that it ends with everything it started.
process-wrap = { version = "10", features = ["tokio1"] }
cookie_store = { version = "0.22.1", default-features = false, features = ["serde_json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The type process-wrap takes creation flags as.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tower-service = "0.3"
# The test server routes by service name.
tonic = { version = "0.14", default-features = false, features = ["transport", "router"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

# The executable's icon (what Task Manager and Explorer show) is a resource compiled in by build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

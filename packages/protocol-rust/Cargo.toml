[package]
name = "bifurc-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Bifurc engine<->client wire protocol: versions, envelope, errors, events and command schemas."

[lib]
name = "bifurc_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

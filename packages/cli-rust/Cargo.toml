[package]
name = "bifurc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Bifurc command line: a client of a Bifurc engine over its socket (a named pipe on Windows)."

[[bin]]
name = "bifurc"
path = "src/main.rs"

[dependencies]
bifurc-engine-client = { path = "../../ui/crates/engine-client" }
serde_json = { version = "1", features = ["preserve_order"] }

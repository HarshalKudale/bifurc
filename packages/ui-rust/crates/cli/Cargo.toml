[package]
name = "bifurc-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The `bifurc` command of an installed Bifurc: runs the packaged CLI, or the MCP server with `--mcp`."

[[bin]]
name = "bifurc-launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# The user's PATH lives in the registry.
winreg = "0.56"

[package]
name = "bifurc-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Bifurc engine's tray icon: a helper the engine runs, and talks to over stdio."

[[bin]]
name = "bifurc-tray"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.1"
# The tray icon ships as a PNG.
png = "0.17"
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

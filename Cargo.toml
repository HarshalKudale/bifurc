# The Rust engine and CLI. The desktop UI is its own workspace in `packages/ui-rust`.
[workspace]
resolver = "2"
members = ["packages/protocol-rust", "packages/client-rust", "packages/engine-rust", "packages/cli-rust", "packages/mcp-rust", "xtask"]
exclude = ["packages/ui-rust"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Harshal Kudale"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Argon2 is the one slow thing a vault does; unoptimised it takes seconds per key in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

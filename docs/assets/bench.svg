<text x="0" y="26" class="t">Install size on disk</text><text x="102" y="51" class="l" text-anchor="end">Bifurc</text><rect x="110" y="38" width="88" height="18" rx="3" class="us"/><text x="206" y="51" class="v">91 MB</text><text x="102" y="81" class="l" text-anchor="end">Postman</text><rect x="110" y="68" width="520" height="18" rx="3" class="them"/><text x="638" y="81" class="v">535 MB</text><text x="0" y="134" class="t">Idle memory (private working set)</text><text x="102" y="159" class="l" text-anchor="end">Bifurc</text><rect x="110" y="146" width="50" height="18" rx="3" class="us"/><text x="168" y="159" class="v">90 MB</text><text x="102" y="189" class="l" text-anchor="end">Postman</text><rect x="110" y="176" width="520" height="18" rx="3" class="them"/><text x="638" y="189" class="v">940 MB</text><text x="0" y="230" class="c">Windows 11, 2026-10. Lower is better.</text>
